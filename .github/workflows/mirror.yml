name: Mirror docspace
on:
  workflow_dispatch:
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - name: Pull and save
        run: |
          docker pull onlyoffice/docspace:latest
          docker pull onlyoffice/opensearch:2.18.0
          mkdir -p out
          docker save onlyoffice/docspace:latest onlyoffice/opensearch:2.18.0 | gzip -1 > out/docspace.tar.gz
      - name: Split into parts
        run: |
          cd out
          split -b 1800M -d docspace.tar.gz docspace.part
          rm -f docspace.tar.gz
          ls -la
      - name: Upload release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          gh release create v1 docspace.part* -R huanghuabing/docspace-mirror --title "docspace+opensearch" --notes "auto mirror"
